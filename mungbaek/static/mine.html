<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>멍백홈 · 내 공고</title>
<link rel="stylesheet" href="/common.css">
<style>
  .wrap{max-width:560px; margin:0 auto; padding:16px 16px 40px; display:grid; gap:12px}
  .lead{margin:0; font-size:13px; color:var(--ink-soft); text-align:center; line-height:1.6}
  .card-n{padding:14px; display:grid; gap:12px}
  .n-head{display:flex; gap:13px; align-items:center}
  .n-img{width:60px;height:60px;border-radius:16px;flex:none;overflow:hidden;
    background:linear-gradient(135deg,#FBE8CF,#F3D6B0); border:1px solid var(--line);
    display:flex;align-items:center;justify-content:center}
  .n-img img{width:100%;height:100%;object-fit:cover}
  .n-img svg{width:44px;height:44px}
  .n-body{min-width:0;flex:1;display:grid;gap:3px}
  .n-name{font-size:17px;font-weight:800;letter-spacing:-.02em;display:flex;align-items:center;gap:7px;flex-wrap:wrap}
  .n-meta{font-size:12.5px;color:var(--ink-soft);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .n-stat{font-size:12px;color:var(--ink-faint)}
  .n-stat b{color:var(--navy)}
  .n-acts{display:grid; grid-template-columns:repeat(3,1fr); gap:7px}
  .n-act{display:flex; align-items:center; justify-content:center; gap:6px;
    padding:11px 6px; border-radius:11px; font-size:12.5px; font-weight:800;
    border:1.5px solid var(--line); background:var(--surface); color:var(--ink-soft); text-decoration:none}
  .n-act:hover{border-color:var(--navy); color:var(--navy)}
  .n-act.primary{background:var(--navy); color:var(--on-navy); border-color:var(--navy)}
  .add{display:flex; align-items:center; justify-content:center; gap:8px; width:100%;
    padding:15px; border-radius:13px; font-size:14.5px; font-weight:800;
    border:1.5px dashed var(--line); background:var(--surface); color:var(--navy); text-decoration:none}
  .empty{padding:34px 20px; text-align:center; color:var(--ink-faint); font-size:13.5px; line-height:1.8}
  .foot{text-align:center; font-size:12.5px; color:var(--ink-faint); line-height:1.7}
  .foot a{color:var(--navy); font-weight:800; text-decoration:none}
</style>
</head>
<body>

<header class="mb">
  <a class="logo" href="/">
    <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
      <path d="M12 21c-3.5 0-6-2-6-4.6 0-2.9 2.8-5.9 6-5.9s6 3 6 5.9c0 2.6-2.5 4.6-6 4.6Z" fill="var(--navy)"/>
      <circle cx="6.2" cy="8.6" r="2.1" fill="var(--navy)"/><circle cx="17.8" cy="8.6" r="2.1" fill="var(--navy)"/>
      <circle cx="9.4" cy="4.9" r="2" fill="var(--navy)"/><circle cx="14.6" cy="4.9" r="2" fill="var(--navy)"/>
    </svg>
    멍백홈
  </a>
  <div class="page-name"><b>내 공고</b> · 내가 올린 강아지</div>
</header>

<div class="wrap">
  <p class="lead">이 기기에 저장된 내 공고예요.</p>
  <div id="list"><div class="empty">불러오는 중…</div></div>
  <a class="add" href="/new"><span class="ic" data-icon="plus"></span>새 공고 등록</a>
  <p class="foot">다른 기기에서 만든 공고는 <a href="/find">이름 · 나이 · PIN으로 찾기</a></p>
</div>

<div class="toast" id="toast" role="status"></div>

<script src="/icons.js"></script>
<script src="/session.js"></script>
<script src="/nav.js" data-nav="mine"></script>
<script>
const $=s=>document.querySelector(s);
function toast(m){const t=$("#toast");t.textContent=m;t.classList.add("show");clearTimeout(t._h);t._h=setTimeout(()=>t.classList.remove("show"),2600);}
const dogSvg=`<svg viewBox="0 0 64 64" aria-hidden="true">
  <ellipse cx="32" cy="38" rx="20" ry="18" fill="#FFFDF8"/>
  <ellipse cx="14" cy="26" rx="8" ry="12" fill="#F5EEDF" transform="rotate(-18 14 26)"/>
  <ellipse cx="50" cy="26" rx="8" ry="12" fill="#F5EEDF" transform="rotate(18 50 26)"/>
  <circle cx="32" cy="30" r="15" fill="#FFFDF8"/>
  <circle cx="26.5" cy="28" r="2.1" fill="#3A3A3A"/><circle cx="37.5" cy="28" r="2.1" fill="#3A3A3A"/>
  <ellipse cx="32" cy="34.5" rx="3" ry="2.4" fill="#3A3A3A"/></svg>`;

(async () => {
  const saved=MB.readList();
  if(!saved.length){
    $("#list").innerHTML=`<div class="card empty">아직 올린 공고가 없어요.<br>
      강아지를 잃어버리셨다면 아래에서 공고를 등록해주세요.</div>`;
    return;
  }
  const cards=await Promise.all(saved.map(async rec=>{
    try{
      const n=await (await fetch("/api/notice?slug="+encodeURIComponent(rec.slug))).json();
      if(n.error) throw new Error();
      return {rec, n};
    }catch(e){ return {rec, n:null}; }
  }));

  $("#list").innerHTML=cards.map(({rec,n})=>{
    if(!n) return `<section class="card card-n"><div class="n-head">
      <span class="n-img">${dogSvg}</span>
      <span class="n-body"><span class="n-name">${esc(rec.dogName||"공고")}</span>
      <span class="n-meta">서버에서 찾을 수 없는 공고예요</span></span></div></section>`;
    const found=n.status==="찾았어요";
    const pic=n.thumb||n.photo;
    return `<section class="card card-n">
      <div class="n-head">
        <span class="n-img">${pic?`<img src="${esc(pic)}" alt="">`:dogSvg}</span>
        <span class="n-body">
          <span class="n-name">${esc(n.dogName)}
            <span class="badge ${found?"b-trusted":"b-important"}">${esc(n.status)}</span></span>
          <span class="n-meta">${esc(n.breed||"")} · ${esc(n.age||"")}</span>
          <span class="n-stat">목격 제보 <b>${esc(n.reportCount||0)}건</b> · ${esc(n.lostPlace||"")}</span>
        </span>
      </div>
      <div class="n-acts">
        <a class="n-act primary" href="/m/${encodeURIComponent(rec.ownerKey)}">지도 보기</a>
        <a class="n-act" href="/share?slug=${encodeURIComponent(rec.slug)}">전단지</a>
        <a class="n-act" href="/new?edit=${encodeURIComponent(rec.slug)}">수정</a>
      </div>
    </section>`;
  }).join("");
})();
</script>
</body>
</html>
